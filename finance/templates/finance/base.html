<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}USFMAE-IS{% endblock %}</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2933;
      background: #f5f7fa;
    }
    header {
      background: #102a43;
      color: white;
      padding: 1rem 2rem;
    }
    nav a {
      color: white;
      margin-right: 1rem;
      text-decoration: none;
    }
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      padding: 1rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border-bottom: 1px solid #d9e2ec;
      padding: 0.65rem;
      text-align: left;
    }
    th {
      background: #eef2f7;
    }
    form p {
      display: grid;
      gap: 0.35rem;
      max-width: 420px;
    }
    input, select {
      padding: 0.5rem;
    }
    button, .button {
      background: #0b69a3;
      border: 0;
      border-radius: 4px;
      color: white;
      display: inline-block;
      padding: 0.55rem 0.85rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>USFMAE-IS</h1>
    <nav>
      <a href="{% url 'finance:dashboard' %}">Dashboard</a>
      <a href="{% url 'finance:student_list' %}">Students</a>
      <a href="{% url 'finance:charges' %}">Charges</a>
      <a href="{% url 'finance:payments' %}">Payments</a>
      <a href="{% url 'finance:aid_applications' %}">Aid Applications</a>
      <a href="{% url 'finance:reports' %}">Reports</a>
      <a href="/admin/">Django Admin</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
